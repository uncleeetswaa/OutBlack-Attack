function newTurn(){G.wind=G.a.wind?Math.round((rn()*2-1)*10)/10:0;G.st='aim';G.ct=0;G.pl[G.turn].th=0}
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function launch(p,ux,uy,pw){const w=WP[p.c.w];const v=600*w.v*pw,l=Math.hypot(ux,uy)||1;G.pr={x:p.x+p.dir*12,y:p.y-42,vx:ux/l*v,vy:uy/l*v,w,k:p.c.w,a:0,t:0,own:G.turn,back:0,hit:0,dead:0};G.st='fly';p.th=.3;SFX.throw()}
function step(p,dt){const w=p.w;p.t+=dt;if(w.ret&&p.t>.5)p.back=1;
if(p.back){const o=G.pl[p.own],dx=o.x-p.x,dy=o.y-50-p.y,d=Math.hypot(dx,dy)||1;p.vx+=dx/d*1800*dt;p.vy+=dy/d*1800*dt;p.vx*=.985;p.vy*=.985;if(d<22)p.dead=1}
else{p.vy+=GR*w.g*dt;p.vx+=G.wind*70/w.m*dt}
p.x+=p.vx*dt;p.y+=p.vy*dt;p.a=w.al?Math.atan2(p.vy,p.vx):p.a+(w.sp||10)*dt*Math.sign(p.vx||1)}
function probe(p,tg){const ob=G.a.ob;if(p.y>=GY-3)return{g:1};if(Math.abs(p.x-180)<ob[0]/2+p.w.r*.5&&p.y>GY-ob[1])return{o:1};if(tg&&!p.hit)for(const z of zones(tg))if(dist(p.x,p.y,z.x,z.y)<z.r+p.w.r)return{z};return null}
function burst(x,y,n,col,sp,g=600,sh='c',r=3,l=1){for(let i=0;i<n;i++){const a=rn()*7,s=sp*(.3+rn());G.par.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.3,g,c:Array.isArray(col)?col[i%col.length]:col,sh,r:r*(.6+rn()),l:l*(.6+rn()*.6),m:l*1.6})}}
const txt=(x,y,s,c,sz=22,l=1.2)=>G.tx.push({x,y,s,c,sz,l,m:l});
function fxAt(w,x,y,vx){const gore=S.gore,bl=gore?['#d81818','#a00']:['#ffd23a','#ff8a2a'];
switch(w.fx){
case'pierce':case'chop':burst(x,y,gore?26:10,bl,260,700,gore?'c':'s',3.5);if(w.fx=='chop')G.shake=5;break;
case'splash':burst(x,y,24,w.col,230,700,'c',3.5);burst(x,y,10,'#e8f8ff',300,900,'s',3);SFX.glass();break;
case'boom':burst(x,y,22,'#777',120,-60,'c',9,1.6);burst(x,y,26,['#ff4a8a','#ffd23a','#4af0ff','#7be03a'],340,500,'s',4,1.6);burst(x,y,12,'#ff8a2a',280,300,'c',5,.6);G.shake=9;SFX.boom();break;
case'punch':burst(x,y,14,'#ffd23a',300,200,'s',6);G.par.push({x,y,vx:0,vy:0,g:0,c:'#fff',sh:'r',r:6,l:.4,m:.4});G.shake=7;break;
case'wave':for(let i=0;i<3;i++)G.par.push({x,y,vx:0,vy:0,g:0,c:'#4af0ff',sh:'r',r:6+i*8,l:.5+i*.1,m:.5+i*.1});G.shake=8;SFX.wave();break;
default:burst(x,y,14,'#ffd23a',240,300,'s',6);G.shake=3}}
function hurt(i,z,p){const pl=G.pl[i],sh=G.pl[p.own],w=p.w;p.hit=1;let m=z.m,crit=rn()<.12;let d=Math.round(w.d*sh.c.dm*m*(crit?1.5:1)*(.9+rn()*.2));
pl.hp=Math.max(0,pl.hp-d);pl.ht=.6;pl.kv=Math.sign(p.vx||1)*(w.kb||70);
const lab=z.k=='head'?'HEADSHOT!':crit?'CRITICAL HIT!':z.k=='body'?'DIRECT HIT!':'';
if(lab)txt(z.x,z.y-30,lab,z.k=='head'?'#ffd23a':crit?'#ff4a8a':'#fff',z.k=='head'?30:24,1.4);
txt(z.x,z.y-6,'-'+d+' DAMAGE','#fff',20,1.3);
fxAt(w,p.x,p.y,p.vx);
if(w.fx=='splash')pl.wet=w.col;
if(z.k=='head'){SFX.head();G.slow=.5;G.shake=Math.max(G.shake,9);burst(z.x,z.y,14,'#ffd23a',320,300,'s',7)}else SFX.hit();
if(S.gore&&(pl.hp<=0||d>=w.d*sh.c.dm*1.8))burst(z.x,z.y,1,pl.c.sk,200,800,'c',9,3);
if(w.fx=='boom'||w.fx=='wave')p.dead=1;else if(w.ret)p.hit=1;else p.dead=1;
if(pl.hp<=0){if(G.mode=='prac'){pl.hp=pl.mh;txt(pl.x,pl.y-90,'KO! RESET','#fff',22)}else{pl.dead=1}}}
function impact(p,gnd){const w=p.w;if(gnd){if(w.fx=='splash'){fxAt(w,p.x,GY-4,0)}else if(w.fx=='boom'||w.fx=='wave')fxAt(w,p.x,GY-6,0);else burst(p.x,GY-2,8,G.a.gt,140,500,'c',3);
if(w.aoe){const o=G.pl[1-p.own];if(dist(p.x,p.y,o.x,o.y-40)<w.aoe+15){const d=Math.round(w.d*.6*G.pl[p.own].c.dm);o.hp=Math.max(0,o.hp-d);o.ht=.6;o.kv=Math.sign(o.x-p.x)*200;txt(o.x,o.y-90,'BLAST! -'+d,'#ff8a2a',22);if(o.hp<=0&&G.mode!='prac')o.dead=1}}}
p.dead=1}
function cpuShot(){const me=G.pl[1],tg=G.pl[0],w=WP[me.c.w],lv=G.lv,hd=rn()<.3+.05*lv;let best=1e9,ba=45,bp=.7;
const ty=tg.y-(hd?60:40);
for(let a=8;a<=80;a+=2)for(let pw=.3;pw<=1.001;pw+=.03){const r=a*PI/180,v=600*w.v*pw;const p={x:me.x-12,y:me.y-42,vx:-Math.cos(r)*v,vy:-Math.sin(r)*v,w,a:0,t:0,own:1,back:0,hit:0,dead:0};let md=1e9;for(let i=0;i<150;i++){step(p,.02);const d=dist(p.x,p.y,tg.x,ty);if(d<md)md=d;const pr=probe(p,null);if(pr||p.x<-50||p.x>W+50)break}if(md<best){best=md;ba=a;bp=pw}}
const err=Math.max(.5,15-lv*1.2),ea=(rn()*2-1)*err,r=(ba+ea)*PI/180,pw=Math.min(1,bp*(1+(rn()*2-1)*err/70));
launch(me,-Math.cos(r),-Math.sin(r),pw)}
function update(dt){G.t+=dt;if(G.pause)return;const rd=dt;if(G.slow>0){G.slow-=rd;dt*=.3}G.shake*=.9;
G.pl.forEach(p=>{p.kx+=p.kv*dt;p.kv*=Math.pow(.02,dt);if(!p.dead)p.kx*=Math.pow(.15,dt);p.kx=Math.max(-70,Math.min(70,p.kx));p.ht=Math.max(0,p.ht-dt);p.th=Math.max(0,p.th-dt);
const tr=p.dead?(p.dir>0?-1.5:1.5):Math.sin(p.ht*40)*.2*p.ht;p.rot+=(tr-p.rot)*Math.min(1,8*dt);p.arm=p.th>0?-1.2+(.3-p.th)*6:aim&&G.pl[G.turn]==p?-.5:.3});
if(G.st=='aim'&&G.cpu[G.turn]){G.ct+=dt;if(G.ct>1.1){if(G.mode=='prac'){G.turn=0;newTurn()}else cpuShot()}}
if(G.st=='fly'){const p=G.pr;for(let i=0;i<3&&!p.dead;i++){step(p,dt/3);const o=1-G.turn,pr=probe(p,G.pl[o]);if(pr&&pr.z)hurt(o,pr.z,p);else if(pr&&(pr.g||pr.o)){if(p.w.ret&&pr.o){p.back=1}else impact(p,1)}if(p.x<-300||p.x>W+300||p.t>5)p.dead=1}
if(p.dead){G.st='wait';G.wt=.9;G.pr=null}}
else if(G.st=='wait'){G.wt-=dt;if(G.wt<=0){const dd=G.pl.findIndex(p=>p.dead);if(dd>=0){G.st='end';G.wt=1.5;G.pl[1-dd].win=1;G.over=1;(dd==1||G.mode=='2p')&&SFX.win();dd==0&&G.mode!='2p'&&SFX.lose()}else{G.turn=G.mode=='prac'?0:1-G.turn;newTurn()}}}
else if(G.st=='end'){G.wt-=dt;if(G.wt<=0){G.st='done';fin(G.pl.findIndex(p=>p.win))}}
G.par=G.par.filter(q=>{q.l-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;if(q.sh=='r')q.r+=90*dt;if(q.y>GY-1&&q.g>0){q.y=GY-1;q.vy*=-.3;q.vx*=.7}return q.l>0});
G.tx=G.tx.filter(q=>{q.l-=dt;q.y-=22*dt;return q.l>0})}
function draw(){const t=G.t;ctx.setTransform(2,0,0,2,0,0);ctx.save();if(G.shake>.5)ctx.translate((rn()-.5)*G.shake,(rn()-.5)*G.shake);bg(G.a,t);
G.pl.forEach((p,i)=>dc(p.c,p.x+p.kx,p.y,p.dir,{t:t+i,rot:p.rot,arm:p.arm,hold:G.st=='aim'&&G.turn==i&&!p.dead,wet:p.wet,win:p.win}));
if(G.pr){const p=G.pr;dp(p.k,p.x,p.y,p.a,1.1)}
if(G.st=='aim'&&!G.cpu[G.turn]&&!aim){const p=G.pl[G.turn];ctx.fillStyle='#ffd23a';ctx.strokeStyle='#000';ctx.lineWidth=2;const by=p.y-100+Math.sin(t*6)*4;ctx.beginPath();ctx.moveTo(p.x-8,by-10);ctx.lineTo(p.x+8,by-10);ctx.lineTo(p.x,by);ctx.closePath();ctx.fill();ctx.stroke()}
if(aim&&G.st=='aim'){const p=G.pl[G.turn],dx=aim.sx-aim.cx,dy=aim.sy-aim.cy,l=Math.min(Math.hypot(dx,dy),110),pw=l/110,w=WP[p.c.w],nl=Math.hypot(dx,dy)||1,v=600*w.v*pw;
const q={x:p.x+p.dir*12,y:p.y-42,vx:dx/nl*v,vy:dy/nl*v,w,a:0,t:0,own:G.turn,back:0};
for(let i=0;i<9;i++){step(q,.04);ctx.globalAlpha=1-i/10;ci(q.x,q.y,3.4-i*.15,'#fff');ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke()}ctx.globalAlpha=1;
fr(p.x-30,p.y+14,60,8,'#000');fr(p.x-28,p.y+16,56*pw,4,pw>.8?'#e8312a':'#ffd23a')}
G.par.forEach(q=>{ctx.globalAlpha=Math.min(1,q.l/(q.m*.5));if(q.sh=='r'){ctx.strokeStyle=q.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.stroke()}else if(q.sh=='s'){ctx.fillStyle=q.c;ctx.font=q.r*3+'px sans-serif';ctx.textAlign='center';ctx.fillText('★',q.x,q.y)}else ci(q.x,q.y,q.r,q.c)});ctx.globalAlpha=1;
ctx.textAlign='center';G.tx.forEach(q=>{ctx.globalAlpha=Math.min(1,q.l*2);ctx.font=q.sz+'px Bangers,Impact';ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.strokeText(q.s,q.x,q.y);ctx.fillStyle=q.c;ctx.fillText(q.s,q.x,q.y)});ctx.globalAlpha=1;ctx.restore();hud()}
function hud(){ctx.textAlign='left';G.pl.forEach((p,i)=>{const x=i?210:10,w=140,r=p.hp/p.mh;fr(x-2,10,w+4,20,'#000');fr(x,12,w,16,'#444');fr(x+(i?w*(1-r):0),12,w*r,16,r>.5?'#4ad04a':r>.25?'#ffd23a':'#e8312a');ctx.font='16px Bangers,Impact';ctx.textAlign=i?'right':'left';ctx.fillStyle='#fff';ctx.lineWidth=3;ctx.strokeStyle='#000';const nx=i?x+w:x;ctx.strokeText(p.c.n,nx,45);ctx.fillText(p.c.n,nx,45);ctx.font='13px Bangers,Impact';ctx.fillStyle='#ffd23a';ctx.strokeText(WP[p.c.w].n,nx,60);ctx.fillText(WP[p.c.w].n,nx,60)});
ctx.textAlign='center';ctx.font='17px Bangers,Impact';ctx.fillStyle='#fff';const wd=G.wind;const s='WIND '+(wd==0?'CALM':(wd<0?'◀ ':'')+Math.abs(wd).toFixed(1)+(wd>0?' ▶':''));ctx.strokeText(s,180,70);ctx.fillText(s,180,70);const cs='🪙 '+S.coins;ctx.strokeText(cs,180,90);ctx.fillText(cs,180,90);
const hu=!G.cpu[G.turn],ts=G.st=='aim'||G.st=='fly'||G.st=='wait'?(G.mode=='2p'?'PLAYER '+(G.turn+1)+'’S TURN':hu?(G.mode=='prac'?'PRACTICE - HOLD, DRAG, RELEASE':'YOUR TURN - HOLD, DRAG, RELEASE'):'CPU IS AIMING…'):'';ctx.font='20px Bangers,Impact';ctx.fillStyle=hu?'#ffd23a':'#fff';ctx.strokeText(ts,180,H-24);ctx.fillText(ts,180,H-24)}
let last=0;function loop(n){const dt=Math.min(.033,(n-last)/1000||0);last=n;if(G){update(dt);draw()}requestAnimationFrame(loop)}

/* ---------- INPUT ---------- */
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
cv.addEventListener('pointerdown',e=>{au();if(!G||G.pause||G.st!='aim'||G.cpu[G.turn])return;const[x,y]=pt(e),p=G.pl[G.turn];if(dist(x,y,p.x,p.y-40)<80){aim={sx:x,sy:y,cx:x,cy:y};cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(aim){[aim.cx,aim.cy]=pt(e)}});
const rel=()=>{if(!aim)return;const a=aim;aim=null;if(!G||G.st!='aim')return;const dx=a.sx-a.cx,dy=a.sy-a.cy,l=Math.hypot(dx,dy);if(l>14)launch(G.pl[G.turn],dx,dy,Math.min(l,110)/110)};
cv.addEventListener('pointerup',rel);cv.addEventListener('pointercancel',()=>aim=null);

/* ---------- MENUS ---------- */
const ui=h=>{const u=$('#ui');u.innerHTML=h;u.className='';$('#pz').style.display='none';u.scrollTop=0};
function drawThumbs(){const m=ctx;document.querySelectorAll('canvas[data-i]').forEach(c=>{c.width=144;c.height=180;ctx=c.getContext('2d');ctx.setTransform(2,0,0,2,0,0);dc(C[c.dataset.i],36,84,1,{t:0})});ctx=m}
function menu(){G&&(G=null);ui(`<h1>OUTBLACK<br>ATTACK</h1><p>Hold your fighter, drag back, let go.</p><button class="b r" onclick="go('camp')">CAMPAIGN</button><button class="b" onclick="go('cpu')">VS COMPUTER</button><button class="b t" onclick="go('2p')">2 PLAYER</button><button class="b" onclick="go('prac')">PRACTICE</button><button class="b s" onclick="sets()">SETTINGS</button><p>🪙 ${S.coins} coins</p>`)}
function sets(){ui(`<h2>SETTINGS</h2><button class="b" onclick="S.gore=1-S.gore;save();sets()">CARTOON SPLASHES: ${S.gore?'ON':'OFF'}</button><button class="b" onclick="S.snd=1-S.snd;save();sets()">SOUND: ${S.snd?'ON':'OFF'}</button><button class="b" onclick="S.df=S.df%3+1;save();sets()">CPU LEVEL: ${['','EASY','NORMAL','HARD'][S.df]}</button><button class="b r" onclick="menu()">BACK</button>`)}
function go(m){F={m,c:[]};if(m=='camp')return camp();chars(m=='2p'?'PLAYER 1: PICK FIGHTER':'PICK YOUR FIGHTER')}
function camp(){let h='<h2>CAMPAIGN</h2><p>Replay any level with any fighter.</p><div class="g">';for(let i=1;i<=12;i++)h+=i<=S.lv?`<button class="b s" onclick="F.lv=${i};chars('PICK YOUR FIGHTER')">LEVEL ${i}<br>${A[(i-1)%8].n}</button>`:`<button class="b s" disabled style="opacity:.4">🔒 LEVEL ${i}</button>`;ui(h+'</div><button class="b r" onclick="menu()">BACK</button>')}
function chars(t){let h=`<h2>${t}</h2><p>🪙 ${S.coins}</p><div class="g">`;C.forEach((c,i)=>{const u=S.uc.includes(i);h+=`<div class="cd ${u?'':'l'}" onclick="pickC(${i})"><canvas data-i="${i}"></canvas><br>${c.n}<br><small>${WP[c.w].n}</small><br>${u?'HP '+c.hp:'🔒 🪙 '+c.c}</div>`});ui(h+'</div><button class="b r" onclick="menu()">BACK</button>');drawThumbs()}
function pickC(i){if(!S.uc.includes(i)){if(S.coins>=C[i].c){S.coins-=C[i].c;S.uc.push(i);save();return chars('UNLOCKED '+C[i].n+'!')}return chars('NEED 🪙 '+C[i].c)}
F.c.push(i);if(F.m=='2p'&&F.c.length==1)return chars('PLAYER 2: PICK FIGHTER');if(F.m=='camp'){const l=F.lv;return start('camp',F.c[0],(l*3+1)%10,(l-1)%8,l)}arenas()}
function arenas(){let h='<h2>PICK ARENA</h2><p>🪙 '+S.coins+'</p><div class="g">';A.forEach((a,i)=>{const u=S.ua.includes(i);h+=`<div class="cd ${u?'':'l'}" style="background:linear-gradient(${a.sk[0]},${a.sk[1]})" onclick="pickA(${i})"><b style="font-size:20px">${a.n}</b><br>${u?(a.wind?'Windy':'Calm'):'🔒 🪙 '+AC_COST[i]}</div>`});ui(h+'</div><button class="b r" onclick="menu()">BACK</button>')}
function pickA(i){if(!S.ua.includes(i)){if(S.coins>=AC_COST[i]){S.coins-=AC_COST[i];S.ua.push(i);save();return arenas()}return arenas()}
start(F.m,F.c[0],F.m=='2p'?F.c[1]:Math.floor(rn()*10),i,0)}
function pause(){if(!G)return;G.pause=1;ui('<h2>PAUSED</h2><button class="b" onclick="resume()">▶ RESUME</button><button class="b t" onclick="start(...G.args)">RESTART</button><button class="b r" onclick="menu()">QUIT</button>')}
function resume(){G.pause=0;$('#ui').className='h';$('#pz').style.display='block'}
function fin(w){const m=G.mode;let h='',won=w==0;$('#pz').style.display='none';
if(m=='2p')h=`<h1>PLAYER ${w+1}<br>WINS!</h1><button class="b" onclick="start(...G.args)">REMATCH</button>`;
else if(won){const c=m=='camp'?40+G.lv*10:25+S.df*15;S.coins+=c;if(m=='camp')S.lv=Math.max(S.lv,Math.min(13,G.lv+1));save();h=`<h1>VICTORY!</h1><h2>+${c} COINS</h2>`+(m=='camp'&&G.lv<12?`<button class="b" onclick="start('camp',G.args[1],(${G.lv+1}*3+1)%10,${G.lv}%8,${G.lv+1})">NEXT LEVEL</button>`:'')+`<button class="b t" onclick="start(...G.args)">PLAY AGAIN</button>`}
else h='<h1>DEFEATED!</h1><p>Aim for the head - it does double damage.</p><button class="b" onclick="start(...G.args)">RETRY</button>';
ui(h+'<button class="b r" onclick="menu()">MENU</button>')}
menu();requestAnimationFrame(loop);
</script></body></html>
